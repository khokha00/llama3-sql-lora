# =========================================
# llama3-sql-lora project config
# =========================================

model:
  base_model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
  trust_remote_code: false

dataset:
  hf_dataset_id: "gretelai/synthetic_text_to_sql"
  train_split: "train"
  test_split: "test"
  max_train_samples: 8000      # subset for faster Colab training; set null for full dataset
  max_eval_samples: 500
  max_seq_length: 1024

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./output"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  seed: 42
  report_to: "none"           # set to "wandb" if you want experiment tracking

hub:
  push_to_hub: false          # push_to_hub.py handles this separately, after training
  private_repo: false